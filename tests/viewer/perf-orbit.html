<!doctype html>
<!-- S09i orbit fps/memory bench: real RM02/RM04/RM05 bundles (gitignored evidence/S09/local/) through the existing
     adapter + three renderer. ?scene=RM02&secs=6 runs one fixed 360deg orbit (60deg/s) and writes JSON to #out.
     Frame times come from the renderer's own injected requestFrame; nothing here changes product code.
     Serve the worktree root on 127.0.0.1 (local check only). Scale UNVERIFIED; not Gate R / physics evidence. -->
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S09i orbit bench</title>
<script type="importmap">{"imports":{"three":"/Build/web/node_modules/three/build/three.module.js"}}</script>
<style>body{margin:0;font:12px system-ui} #out{white-space:pre-wrap;word-break:break-all} #host{width:100%;height:70vh}</style>
<div id="host"></div><pre id="out">PENDING</pre>
<script type="module">
import * as THREE from 'three';
import { createArtifactLoader } from '/Build/web/src/viewer/artifact-loader.mjs';
import { createViewerAdapter } from '/Build/web/src/viewer/adapter.mjs';
import { createThreeRenderer } from '/Build/web/src/viewer/three-renderer.mjs';

  return g ? { vendor: g.getParameter(x ? x.UNMASKED_VENDOR_WEBGL : g.VENDOR), renderer: g.getParameter(x ? x.UNMASKED_RENDERER_WEBGL : g.RENDERER) } : null; })();

  if (!/^RM0[245]$/.test(rm ?? '')) throw new Error('need ?scene=RM02|RM04|RM05');

    { loadScene: createArtifactLoader({ bundleUrl: () => root }), signal: new AbortController().signal,

</script>
