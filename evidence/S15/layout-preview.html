<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S15b layout preview (SYNTHETIC)</title><style>:root {
  color-scheme: light;
  --paper: #f5f8fb;
  --ink: #172e43;
  --blue: #155a92;
  --muted: #486579;
  --rule: #ccd9e3;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.6 "Segoe UI", sans-serif; }
a { color: var(--blue); text-underline-offset: .2em; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--blue); outline-offset: 5px; }
.skip-link { position: absolute; left: 1rem; top: -6rem; padding: .6rem; background: white; z-index: 10; }
.skip-link:focus { top: .5rem; }
.site-header, main, .site-footer { width: min(1120px, calc(100% - 3rem)); margin-inline: auto; }
.site-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 1.5rem; border-bottom: 1px solid var(--rule); }
.site-header nav { display: flex; flex-wrap: wrap; gap: 1rem; }
.wordmark { color: var(--ink); text-decoration: none; font-weight: 700; font-size: 1.2rem; }
main { min-height: 70vh; padding-block: 4rem; }
h1, h2 { font-family: Georgia, serif; line-height: 1.12; font-weight: 400; text-wrap: balance; }
h1 { font-size: clamp(2.3rem, 5vw, 4rem); margin: 0 0 1.5rem; max-width: 18ch; }
h2 { font-size: 1.7rem; margin-top: 0; }
p { max-width: 65ch; margin-block: 0 1.5rem; }
.lede { font-size: 1.25rem; }
.entry { display: grid; grid-template-columns: 1.1fr 1fr; align-items: center; gap: 3rem; }
.primary-link { display: inline-block; background: var(--blue); color: white; padding: .8rem 1.25rem; border-radius: 6px; font-weight: 600; }
.bench { margin: 0; color: var(--blue); }
.bench svg { display: block; width: 100%; height: auto; }
figcaption { text-align: center; color: var(--ink); }
figcaption span { display: block; font-size: .85rem; color: var(--muted); }
.reading { max-width: 760px; }
.mount-note { margin-top: 3rem; padding: 1.5rem; border-left: 4px solid var(--rule); background: white; }
.mount-note p { margin-bottom: 0; }
.site-footer { padding-block: 1.5rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: .9rem; }
button { font: inherit; color: white; background: var(--blue); border: 0; border-radius: 6px; padding: .6rem 1rem; margin-right: 1rem; cursor: pointer; }
@media (max-width: 700px) {
  .entry { grid-template-columns: 1fr; gap: 2rem; }
  main { padding-block: 2.5rem; }
  .site-header { flex-wrap: wrap; }
  .bench { max-width: 420px; }
}
/* S15b: responsive slot layout. Wide: stage rail on top, viewport left, panel + job status right. Narrow: one column. */
.ws { display: grid; gap: 1rem; grid-template-columns: minmax(0, 2fr) minmax(16rem, 1fr);
  grid-template-areas: "nav nav" "viewport panel" "viewport job"; align-items: start; }
.ws-stages { grid-area: nav; }
.ws-stages ol { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; margin: 0; padding: 0; list-style: none; font-size: .95rem; }
.ws-stages li { color: var(--muted); }
.ws-stages li[data-status="done"] { color: var(--ink); }
.ws-stages li[aria-current="step"] { color: var(--blue); font-weight: 700; border-bottom: 2px solid currentColor; }
.ws-viewport { grid-area: viewport; min-width: 0; }
.ws-panel { grid-area: panel; }
.ws-job { grid-area: job; font-size: .9rem; }
.ws-host { position: relative; width: 100%; min-height: 22rem; aspect-ratio: 4 / 3; background: #0f1d2a; border-radius: 6px; overflow: hidden; }
.ws-banner { margin: 0 0 .5rem; padding: .35rem .6rem; border: 1px solid var(--rule); border-radius: 4px; background: #fff8e1; font-size: .85rem; }
.ws-status { margin: .5rem 0 0; font-size: .9rem; color: var(--muted); }
.ws-error { color: #8a1c1c; }
@media (max-width: 860px) {
  .ws { grid-template-columns: minmax(0, 1fr); grid-template-areas: "nav" "viewport" "panel" "job"; }
  .ws-host { min-height: 16rem; }
}
</style><main><div class="ws" data-phase="interview.active"><nav class="ws-stages" data-slot="stage-nav" aria-label="Workspace stages"><ol><li data-status="done">Upload</li><li data-status="current" aria-current="step">Interview</li><li data-status="todo">Run</li><li data-status="todo">Fit</li><li data-status="todo">Report</li></ol></nav><section class="ws-viewport" data-slot="viewport" aria-label="Scene viewport"><p class="ws-banner" role="note">SYNTHETIC scene: authored geometry, not reconstruction, measurement or gate evidence</p><div class="ws-host" data-viewer-status="empty"></div><p class="ws-status" role="status" aria-live="polite">No scene yet. The viewport appears when an upload produces a scene.</p></section><section class="ws-panel" data-slot="panel" aria-label="Stage panel"><h2>Scene ready; interview in progress (not a measurement)</h2></section><aside class="ws-job" data-slot="job-status" aria-label="Job status"><p>Job synthetic-job-v1</p></aside></div></main>
